server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API requests go to the backend container; the browser sees one origin.
    location /api/ {
        # Slightly above NEXUS_MAX_UPLOAD_MB so the API (not nginx) returns the clear error.
        client_max_body_size 25m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html for client-side routing.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
