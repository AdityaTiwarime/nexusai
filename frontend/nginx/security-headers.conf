# Included in every location that serves the app (nginx drops server-level add_header
# lines in any location that has its own add_header, so they can't live at server level).
# The app loads nothing from other origins, so the policy can be strict: no inline
# scripts, no eval, no framing. HSTS is added by the HTTPS proxy (Caddy), not here.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
