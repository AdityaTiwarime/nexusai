server {
    # Unprivileged image: nginx runs as a normal user, so it listens on 8080.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # API requests go to the backend; the browser sees one origin. The API sets its own
    # headers (no-store, nosniff).
    location /api/ {
        # Slightly above NEXUS_MAX_UPLOAD_MB so the API (not nginx) returns the clear error.
        client_max_body_size 25m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Keep the scheme the user actually used when an HTTPS proxy sits in front.
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
    }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html for client-side routing.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

# Use X-Forwarded-Proto from the proxy in front (Caddy / ingress) if there is one.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
