[project]
name = "nexusai-backend"
version = "0.5.0"
description = "NexusAI - Enterprise Intelligence & Autonomous Workflow Platform (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165,<0.200",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "pyjwt>=2.10,<3",
    "email-validator>=2.2,<3",
    "python-multipart>=0.0.18",
    "httpx>=0.28,<1",
    "redis>=5.2,<7",
    "pgvector>=0.3.6,<0.5",
    "pypdf>=5.1,<7",
    "python-docx>=1.1,<2",
    "langgraph>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.8,<0.10",
    "reportlab>=4.2,<5",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
