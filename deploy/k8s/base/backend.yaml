apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: nexusai
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: nexusai
      app.kubernetes.io/component: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the current capacity: a broken release can't take the API down,
      # it just never becomes ready (and `kubectl rollout undo` returns to the last one).
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexusai
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: nexusai
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-schema
          image: nexusai-backend
          command: ["python", "-m", "app.db.schema_check", "--timeout", "600"]
          envFrom:
            - configMapRef: { name: nexusai-config }
            - secretRef: { name: nexusai-secrets }
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: backend
          image: nexusai-backend
          # Migrations are the job's responsibility here, not the API's start command.
          command: ["uvicorn", "app.asgi:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: nexusai-config }
            - secretRef: { name: nexusai-secrets }
          startupProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            # Includes the database: a pod that can't reach it stops getting traffic.
            httpGet: { path: /api/v1/health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            # Process only (not the database), so a database outage doesn't restart every pod.
            httpGet: { path: /api/v1/health/live, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: uploads, mountPath: /data/uploads }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: nexusai-uploads
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  # Named "backend" because the frontend's nginx proxies /api to http://backend:8000.
  name: backend
  labels:
    app.kubernetes.io/name: nexusai
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: nexusai
    app.kubernetes.io/component: backend
  ports:
    - { name: http, port: 8000, targetPort: http }
