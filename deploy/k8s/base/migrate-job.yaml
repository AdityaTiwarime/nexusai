# Database migrations run once per release, before the new API and worker pods start
# serving (they wait for the schema in an init container). Running `alembic upgrade`
# in every API replica would race. Delete the finished job before applying a new release.
apiVersion: batch/v1
kind: Job
metadata:
  name: nexusai-migrate
  labels:
    app.kubernetes.io/name: nexusai
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexusai
        app.kubernetes.io/component: migrate
    spec:
      serviceAccountName: nexusai
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: nexusai-backend
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: nexusai-config
            - secretRef:
                name: nexusai-secrets
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
