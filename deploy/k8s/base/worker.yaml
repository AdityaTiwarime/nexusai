apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: nexusai
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: nexusai
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexusai
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: nexusai
      automountServiceAccountToken: false
      # The worker finishes its current job on SIGTERM.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-schema
          image: nexusai-backend
          command: ["python", "-m", "app.db.schema_check", "--timeout", "600"]
          envFrom:
            - configMapRef: { name: nexusai-config }
            - secretRef: { name: nexusai-secrets }
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: worker
          image: nexusai-backend
          command: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef: { name: nexusai-config }
            - secretRef: { name: nexusai-secrets }
          readinessProbe:
            exec:
              command: ["python", "-m", "app.worker", "--healthcheck"]
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 10
          livenessProbe:
            # Heartbeat file younger than 60 s.
            exec:
              command: ["python", "-m", "app.worker", "--healthcheck"]
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: uploads, mountPath: /data/uploads }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: nexusai-uploads
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
